# Moves MabOS's programs to their newest versions (scripts/update-apps.py) for each nixpkgs branch
# MabOS runs on, and commits apps/<branch>.json when something changed. Daily, by hand, and when
# mabos-packages finishes a build (repository_dispatch "packages-built").
name: Update MabOS's programs

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [packages-built]

permissions:
  contents: write

concurrency:
  group: apps

jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        branch: ["26.05"]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Find new versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update-apps.py "${{ matrix.branch }}"

      - name: Commit
        run: |
          if [ -n "$(git status --porcelain apps)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps
            git commit -m "MabOS's programs for ${{ matrix.branch }}: $(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["serial"])' apps/${{ matrix.branch }}.json)"
            git pull --rebase -q
            git push
          fi
